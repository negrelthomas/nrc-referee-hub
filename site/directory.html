<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referee directory | NRC Referee Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="referees.html">
<a class="skip" href="#main">Skip to content</a>
<header id="site-nav"></header>
<div class="wrap" id="main">
<section>
  <h1>Referee directory</h1>
  <p class="muted">Certified USATH referees. Email and phone show for referees who chose to share them with other referees (My profile, under Phone). Levels stay between each referee and the NRC.</p>
  <div class="toolbar"><input id="q" placeholder="Search name, club, city, airport"></div>
  <div class="grid c3" id="list"></div>
</section>
</div>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
let rows = [];
function render() {
  const q = NRC.$("#q").value.toLowerCase();
  NRC.$("#list").innerHTML = rows.filter(r => (!q || [r.first_name, r.last_name, r.club_name, r.home_city, r.home_state, r.home_airport_iata].join(" ").toLowerCase().includes(q)))
    .map(r => `<div class="card" style="display:flex;gap:14px;align-items:center"><img class="avatar lg" src="${r.photo_url ? NRC.esc(r.photo_url) : 'assets/avatar.svg'}" alt=""><div><strong>${NRC.esc(r.last_name + ", " + r.first_name)}</strong>${r.cert_level ? "<br>" + NRC.levelPill(r.cert_level, r.level_confirmed) : ""}<div class="small muted" style="margin-top:6px">${NRC.esc(r.club_name || "No club affiliation")}<br>${NRC.esc([r.home_city, r.home_state].filter(Boolean).join(", "))}${r.home_airport_iata ? " &middot; " + NRC.esc(r.home_airport_iata) : ""}</div>${r.email || r.phone ? `<div class="small" style="margin-top:6px">${r.email ? `<a href="mailto:${NRC.esc(r.email)}">${NRC.esc(r.email)}</a>` : ""}${r.phone ? `${r.email ? "<br>" : ""}<a href="tel:${NRC.esc(r.phone.replace(/[^+\d]/g, ""))}">${NRC.esc(r.phone)}</a>` : ""}</div>` : ""}</div></div>`).join("") || '<div class="card">No referee matches.</div>';
}
document.addEventListener("DOMContentLoaded", async () => {
  if (!await NRC.requireUser()) return;
  const { data } = await NRC.sb.from("referee_directory").select("*").order("last_name");
  rows = (data || []).sort(NRC.byLastName); render();
  ["#q"].forEach(s => NRC.$(s).addEventListener("input", render));
});
</script>
</body>
</html>
