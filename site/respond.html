<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your answer | NRC Referee Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="respond.html">
<a class="skip" href="#main">Skip to content</a>
<header id="site-nav"></header>
<div class="wrap" id="main">
<section style="max-width:560px;margin:0 auto">
  <div class="card" id="box">
    <h2 style="margin-top:0" id="title">One moment</h2>
    <p id="text">Recording your answer.</p>
    <div id="note-wrap" class="hidden">
      <label>Anything the NRC should know (optional)</label><textarea id="note" placeholder="Flight constraints, partner preference, dates..."></textarea>
      <p style="margin-top:12px"><button class="btn" id="btn-send">Send answer</button></p>
    </div>
  </div>
</section>
</div>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const P = new URLSearchParams(location.search); const token = P.get("token"), answer = P.get("answer");
const $ = NRC.$;
async function send(note) {
  const res = await fetch("/api/respond", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token, answer, note }) });
  const d = await res.json();
  $("#note-wrap").classList.add("hidden");
  if (!res.ok) { $("#title").textContent = "This link does not work"; $("#text").textContent = d.error || "Ask the NRC to send a new invitation."; return; }
  const t = d.tournament || {};
  const when = t.start_date ? `${NRC.fmtDate(t.start_date)} to ${NRC.fmtDate(t.end_date)}, ${[t.venue_city, t.venue_state].filter(Boolean).join(", ")}` : "";
  if (d.already) { $("#title").textContent = "Already " + d.status; $("#text").textContent = `${t.name}: this invitation is ${d.status}. Contact the NRC if something changed.`; return; }
  if (d.status === "accepted") { $("#title").textContent = "Thank you" + (d.name ? ", " + d.name : ""); $("#text").innerHTML = `You accepted <strong>${NRC.esc(t.name)}</strong>, ${NRC.esc(when)}. The NRC confirms the final selection by email; nothing to book until then.`; }
  else { $("#title").textContent = "Answer recorded"; $("#text").innerHTML = `You declined <strong>${NRC.esc(t.name)}</strong>. Thank you for answering quickly; it helps the NRC staff the event.`; }
}
document.addEventListener("DOMContentLoaded", () => {
  if (!token || !answer) { $("#title").textContent = "Missing link details"; $("#text").textContent = "Open the link from the invitation email."; return; }
  $("#title").textContent = answer === "accept" ? "Accept this invitation" : "Decline this invitation";
  $("#text").textContent = "Add a note if useful, then send.";
  $("#note-wrap").classList.remove("hidden");
  $("#btn-send").onclick = () => { $("#btn-send").disabled = true; send($("#note").value.trim()); };
});
</script>
</body>
</html>
