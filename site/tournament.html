<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your tournament | NRC Referee Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="tournament.html">
<a class="skip" href="#main">Skip to content</a>
<header id="site-nav"></header>
<div class="wrap" id="main">
<section>
  <div id="box"><h2 style="margin-top:0" id="title">Loading</h2></div>
</section>
</div>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const token = new URLSearchParams(location.search).get("token");
const LEVEL = { candidate: "Candidate", level_1: "Level 1", level_2: "Level 2", level_3: "Level 3 (National)", nachc: "NACHC", ihf: "IHF" };
const SANCTION = { usath: "USATH sanctioned", regional: "Regional", club: "Club", international: "International" };
document.addEventListener("DOMContentLoaded", async () => {
  const box = NRC.$("#box");
  if (!token) { box.innerHTML = "<h2>Missing link</h2><p>Open this page from the email the NRC sent you.</p>"; return; }
  const res = await fetch("/api/tournament-status?token=" + encodeURIComponent(token)); const d = await res.json();
  if (!res.ok) { box.innerHTML = "<h2>This link does not work</h2><p>" + NRC.esc(d.error || "") + " Contact referee@handballusa.org.</p>"; return; }
  const t = d.tournament, D = d.designated;
  const covers = [t.flights_covered ? "Flights covered" : "Flights not covered", (t.hotel_nights_covered || 0) + " hotel nights covered", t.airport_transfers_covered ? "Airport transfers covered" + (t.airport_transfer_how ? " (" + t.airport_transfer_how + ")" : "") : "Airport transfers not covered", t.hotel_to_venue_transport ? "Hotel to venue: " + t.hotel_to_venue_transport : null, t.food_stipend_per_day ? "Food stipend: $" + t.food_stipend_per_day + " per day" : (t.meals_provided ? "Meals: " + t.meals_provided : null), t.earliest_return_last_day ? "Earliest departure on the last day: " + String(t.earliest_return_last_day).slice(0, 5) : null].filter(Boolean);
  box.innerHTML = `<p class="kicker" style="color:var(--red);font-weight:600;margin:0">Organizer page</p><h1 style="margin:4px 0 6px">${NRC.esc(t.name)}</h1>
    <p class="muted">${NRC.fmtDate(t.start_date)} to ${NRC.fmtDate(t.end_date)} at ${NRC.esc(t.venue_name || "")}, ${NRC.esc([t.venue_city, t.venue_state].filter(Boolean).join(", "))}. ${SANCTION[t.sanction] || ""}. ${t.pairs_needed} pair${t.pairs_needed === 1 ? "" : "s"} requested${t.supervisor_needed ? ", supervisor requested" : ""}.</p>
    <div class="grid c3"><div class="stat ${D.length >= t.pairs_needed * 2 ? "good" : ""}"><div class="n">${D.filter(x => x.role === "referee").length}/${t.pairs_needed * 2}</div><div class="l">Referees designated</div></div><div class="stat"><div class="n">${D.filter(x => x.role !== "referee").length}</div><div class="l">Supervisors and observers</div></div><div class="stat"><div class="n">${d.in_progress}</div><div class="l">Invitations in progress</div></div></div>
    <h2>Designated officials</h2>
    ${D.length ? '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Level</th><th>Club</th><th>From</th><th>Contact</th><th>Travel notes</th></tr></thead><tbody>' + D.map(r => `<tr><td><strong>${NRC.esc(r.first_name + " " + r.last_name)}</strong></td><td>${NRC.esc(r.role)}</td><td>${LEVEL[r.cert_level] || ""}</td><td>${NRC.esc(r.club || "")}</td><td>${NRC.esc([r.home_city, r.home_state].filter(Boolean).join(", "))}${r.home_airport_iata ? " (" + NRC.esc(r.departure_airport_iata || r.home_airport_iata) + ")" : ""}</td><td class="small"><a href="mailto:${NRC.esc(r.email)}">${NRC.esc(r.email)}</a>${r.phone ? "<br>" + NRC.esc(r.phone) : ""}</td><td class="small">${NRC.esc(r.travel_notes || "")}</td></tr>`).join("") + "</tbody></table></div>" : '<div class="card"><p>No official confirmed yet. The NRC is working on it; this page updates as they are confirmed.</p></div>'}
    <h2>What you committed to cover</h2><div class="card"><p>${covers.map(NRC.esc).join("<br>")}</p><p class="small muted">Changes to coverage or dates: <a href="login.html?next=organizer.html">sign in to your organizer page</a> (same email, no password) to edit the request; the NRC and the designated referees are notified. Or write to referee@handballusa.org.</p></div>`;
});
</script>
</body>
</html>
